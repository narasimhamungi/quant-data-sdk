[project]
name = "quant-data-sdk"
version = "0.1.0"
description = "Point-in-time-correct join layer over marketdata-lakehouse and pit-fundamentals-store, for quant factor research."
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
